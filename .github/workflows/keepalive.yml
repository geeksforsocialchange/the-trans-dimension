name: Keep scheduled workflows alive

# GitHub disables scheduled workflows after 60 days of repository inactivity.
# That happened on 2026-06-01 (60 days after the last commit), which silently
# froze the site's PlaceCal data for eight weeks — see build.yml.
#
# A monthly commit resets the inactivity clock for the whole repo, which keeps
# the hourly deploy trigger running.

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive timestamp
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep scheduled workflows alive"
          git push
